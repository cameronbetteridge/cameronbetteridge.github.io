<!DOCTYPE html>
<html>
  <head>
    <title>Vapi Middle Man</title>
  </head>
  <body>
    <h1>Press the button to talk to Taylor.</h1>
    <button onclick="startCall()" style="width: 300px; height:100px;">Start Conversation</button>
  </body>
  <script>    
    let connected = false;
    let apiKey = "";
    window.addEventListener("message", (event) => {
      // if (event.origin !== "https://example.com") {
      //   return;
      // }
      connected = true;
      apiKey = event.data;
    }, false);
    
    function startCall() {
      if (!connected) { return; }
      
    }

    const interval = setInterval(() => {
      if (!connected) {
        window.parent.postMessage("iframe-ready", "*"); // Once working, replace '*' with the correct url
      }
    });
  </script>
</html>
